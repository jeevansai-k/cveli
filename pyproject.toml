[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cveli"
version = "0.1.0"
description = "CLI/TUI tool for searching and managing CVE vulnerabilities"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Baymax", email = "baymax@example.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "textual>=0.48.0",
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "diskcache>=5.6.0",
    "rapidfuzz>=3.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.25.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pip-audit>=2.4.0",
    "bandit>=1.7.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
cveli = "cli.app:app"

[tool.setuptools]
packages = ["cli", "core", "sources", "services", "storage", "config", "utils"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "test", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --tb=short"
