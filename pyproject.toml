[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cveli"
version = "2.0.0"
description = "Terminal-first CVE & vulnerability intelligence: search, Exploit-DB research, safe dork building and research templates"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jeevan Sai", email = "kukkalajeevansai@gmail.com" },
]
urls = { "Homepage" = "https://github.com/jeevansai-k/cveli", "Repository" = "https://github.com/jeevansai-k/cveli" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "textual>=0.48.0",
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "diskcache>=5.6.0",
    "rapidfuzz>=3.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.25.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pip-audit>=2.4.0",
    "bandit>=1.7.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "pre-commit>=3.5.0",
    "pytest-textual-snapshot>=1.0.0",
    "anyio>=4.0.0",
]

[project.scripts]
cveli = "cli.app:app"

[tool.setuptools.packages.find]
include = ["cli*", "core*", "sources*", "services*", "storage*", "config*", "utils*"]

[tool.setuptools.package-data]
"cli.tui" = ["*.tcss"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "test", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --tb=short -m 'not live'"
markers = [
    "live: opt-in smoke tests that call real external services (pytest -m live)",
]

[tool.coverage.run]
source = ["cli", "core", "sources", "services", "storage", "config", "utils"]
omit = ["tests/*"]

[tool.coverage.report]
skip_empty = true
show_missing = true
